<ion-content [fullscreen]="true" class="auth">

  <div class="pantalla">

    <div class="marca">
      <div class="logo">T</div>
      <span>Tank<span class="verde">Up</span></span>
    </div>

    <div class="encabezado">
      <p class="subtitulo">BIENVENIDO DE NUEVO</p>
      <h1>Iniciá sesión</h1>
      <p class="descripcion">
        Ingresá a tu cuenta para continuar.
      </p>
    </div>

    <div class="formulario">

      <ion-input
        label="Correo electrónico"
        label-placement="floating"
        type="email"
        placeholder="ejemplo@gmail.com"
        fill="outline">
      </ion-input>

      <ion-input
        label="Contraseña"
        label-placement="floating"
        type="password"
        placeholder="Ingresá tu contraseña"
        fill="outline">
      </ion-input>

      <button class="boton-principal" routerLink="/estaciones">
        Iniciar sesión
      </button>

    </div>

    <div class="pie">
      <p>¿Todavía no tenés una cuenta?</p>
      <a routerLink="/registro">Crear cuenta</a>
    </div>

  </div>

</ion-content>
